[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cascadeur-mcp"
version = "0.1.0"
description = "Independent local Cascadeur MCP server with animation, rig, finger and review tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.2,<3", "filelock>=3.19,<4", "platformdirs>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[project.scripts]
cascadeur-mcp = "cascadeur_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cascadeur_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
